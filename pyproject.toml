[project]
name = "worker"
version = "0.1.0"
description = "Persistent unattended software-development worker"
requires-python = ">=3.11"
dependencies = [
  "fastmcp==3.4.5",
  "langgraph>=0.6,<1",
  "pydantic-settings>=2.6,<3",
  "httpx>=0.27,<1",
  "langgraph-checkpoint-sqlite>=2.0,<3",
]

[dependency-groups]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["autodev"]
