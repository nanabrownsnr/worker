services:
  worker:
    build: .
    container_name: worker
    restart: unless-stopped
    user: "${WORKER_UID:-1001}:${WORKER_GID:-1003}"
    env_file:
      - .env
    environment:
      HOME: /home/nbrown
      UV_CACHE_DIR: /tmp/uv-cache
      AUTODEV_BIND_HOST: 0.0.0.0
      AUTODEV_PORT: 8000
      AUTODEV_DATA_DIR: /var/lib/worker/data
      HERMES_COMMAND: /usr/local/bin/hermes
      HERMES_ENDPOINT: http://host.docker.internal:8000/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "0.0.0.0:8002:8000"
    volumes:
      - ./data:/var/lib/worker/data
      - ${HOME}/.hermes:/home/nbrown/.hermes
      - ${HOME}/.local/bin/hermes:/usr/local/bin/hermes:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
